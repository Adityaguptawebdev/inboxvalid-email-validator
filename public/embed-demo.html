<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InboxValid.ai — Vanilla Embed Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 440px;
        margin: 64px auto;
        padding: 0 20px;
        color: #1c1917;
        background: #faf7f0;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      p.lead {
        color: #78716c;
        font-size: 14px;
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 6px;
      }
      input[type="email"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #ded2b4;
        border-radius: 8px;
        font-size: 14px;
        background: #ffffff;
      }
      input[type="email"]:focus {
        outline: none;
        border-color: #1f4d33;
        box-shadow: 0 0 0 3px rgba(31, 77, 51, 0.15);
      }
      code {
        background: #eae2cc;
        padding: 2px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Vanilla embed demo</h1>
    <p class="lead">
      This is a plain HTML page — no React, no build step. It only includes
      <code>widget.js</code> and marks one input with <code>data-inboxvalid</code>.
    </p>

    <label for="signup-email">Email address</label>
    <input id="signup-email" type="email" data-inboxvalid placeholder="you@example.com" />

    <!-- data-api points at the same mock backend the React app talks to. -->
    <script src="/widget.js" data-api="/api/verify-email"></script>
  </body>
</html>
